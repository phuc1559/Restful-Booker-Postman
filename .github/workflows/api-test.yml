name: API-Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman
        run: |
          newman run "postman/Restful-Booker.postman_collection.json" -e "postman/Restful-Booker.postman_environment.json" --folder "CRUD Flow" --reporters cli,junit --reporter-junit-export newman-results/junit.xml

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: newman-results/



        
         
